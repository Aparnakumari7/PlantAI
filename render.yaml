services:
  - type: web
    name: drplant-ai-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromDatabase:
          name: drplant-db
          property: JWT_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: drplant-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://drplant-ai.vercel.app

databases:
  - name: drplant-db
    databaseName: drplant
    user: drplant_user
    plan: free
    region: ohio
