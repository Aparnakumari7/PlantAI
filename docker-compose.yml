version: '3.8'

services:
  plant-detector:
    build: .
    container_name: plant-detector-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - VITE_GEMINI_API_KEY=${VITE_GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      # Persist SQLite database
      - ./backend/database.sqlite:/app/backend/database.sqlite
      # Optional: Mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - plant-detector-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: plant-detector-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # For SSL certificates (if using)
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - plant-detector
    restart: unless-stopped
    networks:
      - plant-detector-network

networks:
  plant-detector-network:
    driver: bridge

# Optional: Add volumes for persistent data
volumes:
  database:
    driver: local